<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMIX · Materiał wewnętrzny</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="__LOGO__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#FFFFFF; --ink:#000000; --ink-2:#525252; --ink-3:#737373;
    --line:rgba(0,0,0,.10);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.5;letter-spacing:-.02em;
    -webkit-font-smoothing:antialiased;
  }
  .mono{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    font-size:13px;text-transform:uppercase;letter-spacing:.1em;line-height:1.4;
  }

  /* ---------- bramka ---------- */
  #gate{
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;justify-content:center;
    padding:clamp(28px,6vw,72px);max-width:760px;margin:0 auto;
  }
  #gate.is-gone{display:none}

  .g-logo{height:30px;width:auto;align-self:flex-start;margin-bottom:clamp(40px,7vw,80px);filter:brightness(0)}
  .g-eyebrow{color:var(--ink-3);margin:0 0 clamp(20px,3vw,30px)}
  .g-title{
    font-weight:700;letter-spacing:-.05em;line-height:.94;
    font-size:clamp(34px,6vw,64px);margin:0 0 clamp(20px,3vw,28px);
  }
  .g-lede{color:var(--ink-2);max-width:52ch;margin:0 0 clamp(34px,5vw,52px)}

  .g-form{display:flex;flex-direction:column;gap:22px;max-width:440px}
  .g-field{display:flex;flex-direction:column;gap:10px}
  .g-field label{color:var(--ink-3)}
  .g-field input{
    font:inherit;letter-spacing:0;color:var(--ink);
    background:none;border:0;border-bottom:1px solid var(--ink);
    padding:10px 2px;border-radius:0;
  }
  .g-field input:focus{outline:2px solid var(--ink);outline-offset:4px}

  .g-btn{
    font:inherit;font-weight:600;letter-spacing:-.02em;
    background:var(--ink);color:#fff;border:0;border-radius:2px;
    padding:15px 26px;cursor:pointer;align-self:flex-start;
    transition:opacity .5s var(--ease);
  }
  .g-btn:hover{opacity:.72}
  .g-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .g-btn[disabled]{opacity:.4;cursor:default}

  .g-msg{min-height:1.4em;color:var(--ink-2)}
  .g-msg[data-state="error"]{color:var(--ink)}
  .g-msg[data-state="error"]::before{content:"↯ ";}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<main id="gate">
  <img class="g-logo" src="__LOGO__" alt="EMIX">
  <p class="mono g-eyebrow">Materiał wewnętrzny</p>
  <h1 class="g-title">Ten dokument jest zaszyfrowany.</h1>
  <p class="g-lede">
    Treść nie jest ukryta — jest zaszyfrowana (AES-256-GCM). Bez hasła nie da się jej
    odczytać także z kodu źródłowego strony.
  </p>

  <form class="g-form" id="g-form" autocomplete="off">
    <div class="g-field">
      <label class="mono" for="g-pw">Hasło</label>
      <input id="g-pw" name="pw" type="password" autocomplete="current-password"
             spellcheck="false" autocapitalize="off" required>
    </div>
    <button class="g-btn" id="g-btn" type="submit">Otwórz dokument</button>
    <p class="mono g-msg" id="g-msg" role="status" aria-live="polite"></p>
  </form>

</main>

<div id="app"></div>

<script id="payload" type="application/json">__PAYLOAD__</script>

<script>
(function () {
  'use strict';

  var gate = document.getElementById('gate');
  var form = document.getElementById('g-form');
  var input = document.getElementById('g-pw');
  var btn = document.getElementById('g-btn');
  var msg = document.getElementById('g-msg');

  function say(text, state) {
    msg.textContent = text || '';
    if (state) { msg.setAttribute('data-state', state); }
    else { msg.removeAttribute('data-state'); }
  }

  if (!(window.crypto && window.crypto.subtle)) {
    say('Ta przeglądarka nie obsługuje wymaganego szyfrowania. ' +
        'Użyj aktualnej wersji Chrome, Safari, Edge lub Firefoksa.', 'error');
    btn.disabled = true;
    return;
  }

  var blob = JSON.parse(document.getElementById('payload').textContent);

  function b64(s) {
    var raw = atob(s), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) { out[i] = raw.charCodeAt(i); }
    return out;
  }

  function unlock(password) {
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(blob.salt), iterations: blob.iterations, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.ct));
      })
      .then(function (plain) {
        return JSON.parse(new TextDecoder().decode(plain));
      });
  }

  function render(data) {
    document.title = data.title;

    var style = document.createElement('style');
    style.textContent = data.css;
    document.head.appendChild(style);

    document.documentElement.className += ' js';

    var app = document.getElementById('app');
    app.innerHTML = data.html;

    gate.classList.add('is-gone');

    // innerHTML nie wykonuje skryptow — wstrzykujemy element <script>
    var script = document.createElement('script');
    script.textContent = data.js;
    document.body.appendChild(script);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = input.value;
    if (!pw) { say('Podaj hasło.', 'error'); return; }

    btn.disabled = true;
    say('Odszyfrowywanie…');

    // odstep na przemalowanie, zanim PBKDF2 zajmie watek
    setTimeout(function () {
      unlock(pw).then(render).catch(function () {
        btn.disabled = false;
        input.value = '';
        input.focus();
        say('Nieprawidłowe hasło.', 'error');
      });
    }, 30);
  });

  input.focus();
})();
</script>
</body>
</html>
